<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Laporan Penjualan Kukikoe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container bg-white p-4 rounded shadow-sm" style="max-width: 850px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="m-0 fw-bold">Laporan Penjualan Kukikoe</h4>
        <button class="btn btn-primary btn-sm" onclick="muatData()">Muat Ulang Data</button>
    </div>

    <!-- KARTU RINGKASAN -->
    <div class="row g-2 mb-4 text-center">
        <div class="col-4">
            <div class="p-3 bg-primary text-white rounded">
                <small>Total Omset</small>
                <h5 class="m-0 fw-bold" id="totalOmset">Rp0</h5>
            </div>
        </div>
        <div class="col-4">
            <div class="p-3 bg-success text-white rounded">
                <small>Total Cash</small>
                <h5 class="m-0 fw-bold" id="totalCash">Rp0</h5>
            </div>
        </div>
        <div class="col-4">
            <div class="p-3 bg-info text-white rounded">
                <small>Total QRIS</small>
                <h5 class="m-0 fw-bold" id="totalQris">Rp0</h5>
            </div>
        </div>
    </div>

    <!-- TABEL DATA -->
    <div class="table-responsive">
        <table class="table table-bordered align-middle">
            <thead class="table-light">
                <tr>
                    <th>Nota</th>
                    <th>Tanggal / Jam</th>
                    <th>Metode</th>
                    <th>Rincian</th>
                    <th class="text-end">Total</th>
                </tr>
            </thead>
            <tbody id="tabelData">
                <tr><td colspan="5" class="text-center text-muted">Sedang mengambil data dari Google Sheets...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
// LINK APPS SCRIPT ANDA
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzTmbc4ohQyj51JFaiDFyJUdDNyQWK5eNHeC18amt7BARyM8FyenuyXGj6t03eRH6Na/exec";

function rupiah(n) {
    return "Rp" + Number(n).toLocaleString("id-ID");
}

async function muatData() {
    document.getElementById("tabelData").innerHTML = '<tr><td colspan="5" class="text-center text-muted">Sedang mengambil data dari Google Sheets...</td></tr>';
    
    try {
        let response = await fetch(URL_SCRIPT);
        let resData = await response.json();

        // Mengakomodasi format data baik berupa Array langsung maupun Object { status: "success", data: [...] }
        let data = Array.isArray(resData) ? resData : (resData.data || []);

        let totalOmset = 0, totalCash = 0, totalQris = 0;
        let html = "";

        data.forEach(item => {
            let total = Number(item.total) || 0;
            totalOmset += total;

            let metode = (item.pembayaran || "").toLowerCase();
            if (metode === "cash") {
                totalCash += total;
            } else {
                totalQris += total;
            }

            html += `
                <tr>
                    <td><b>#${item.nota || '-'}</b></td>
                    <td>${item.tanggal || '-'} <br><small class="text-muted">${item.jam || ''}</small></td>
                    <td><span class="badge ${metode === 'cash' ? 'bg-success' : 'bg-info'}">${item.pembayaran || 'QRIS'}</span></td>
                    <td>${item.rincian || item.items || '-'}</td>
                    <td class="text-end fw-bold">${rupiah(total)}</td>
                </tr>
            `;
        });

        document.getElementById("totalOmset").innerText = rupiah(totalOmset);
        document.getElementById("totalCash").innerText = rupiah(totalCash);
        document.getElementById("totalQris").innerText = rupiah(totalQris);
        document.getElementById("tabelData").innerHTML = html || '<tr><td colspan="5" class="text-center">Data kosong</td></tr>';

    } catch (err) {
        console.error(err);
        document.getElementById("tabelData").innerHTML = '<tr><td colspan="5" class="text-center text-danger">Gagal terhubung ke Google Sheets. Pastikan spreadsheet terisi dan izin script diset ke "Anyone".</td></tr>';
    }
}

// Jalankan otomatis
muatData();
</script>

</body>
</html>
