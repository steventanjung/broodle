<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report - Kukikoe</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background: #f6f7f9;
        font-family: Arial, sans-serif;
    }

    .container {
        max-width: 900px;
    }

    .header {
        background: #fff;
        border-radius: 18px;
        padding: 20px;
        margin-top: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .brand {
        font-size: 24px;
        font-weight: 800;
    }

    .subtitle {
        color: #777;
        font-size: 14px;
    }

    .report-card {
        background: #fff;
        border-radius: 18px;
        padding: 20px;
        margin-top: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }

    .summary {
        border-radius: 15px;
        padding: 18px;
        background: #f7f7f7;
    }

    .summary-title {
        color: #777;
        font-size: 13px;
        margin-bottom: 5px;
    }

    .summary-value {
        font-size: 22px;
        font-weight: 800;
    }

    .total-box {
        background: #111;
        color: white;
    }

    .cash-box {
        background: #eaf7ee;
    }

    .qris-box {
        background: #eef4ff;
    }

    .table {
        margin-bottom: 0;
    }

    .table th {
        font-size: 13px;
        color: #666;
        font-weight: 600;
    }

    .table td {
        vertical-align: middle;
    }

    .badge-cash {
        background: #198754;
    }

    .badge-qris {
        background: #0d6efd;
    }

    .empty {
        text-align: center;
        padding: 40px 20px;
        color: #888;
    }

    .loading {
        text-align: center;
        padding: 30px;
    }

    .transaction-count {
        color: #777;
        font-size: 14px;
    }

    .btn-report {
        min-width: 120px;
    }

    @media (max-width: 600px) {
        .summary-grid {
            grid-template-columns: 1fr;
        }

        .header {
            padding: 16px;
        }

        .report-card {
            padding: 15px;
        }

        .table {
            font-size: 13px;
        }

        .table th,
        .table td {
            padding: 9px 6px;
        }
    }
</style>
</head>

<body>

<div class="container pb-5">

    <!-- HEADER -->
    <div class="header">
        <div class="brand">Kukikoe</div>
        <div class="subtitle">Laporan Penjualan</div>

        <div class="row g-2 mt-3">
            <div class="col-12 col-md-8">
                <label class="form-label fw-semibold">Pilih Tanggal</label>
                <input type="date" id="datePicker" class="form-control">
            </div>

            <div class="col-12 col-md-4 d-flex align-items-end">
                <button class="btn btn-dark w-100 btn-report" onclick="loadReport()">
                    Tampilkan
                </button>
            </div>
        </div>
    </div>


    <!-- SUMMARY -->
    <div id="summarySection" class="report-card d-none">

        <h5 class="fw-bold mb-3">
            Laporan <span id="reportDate"></span>
        </h5>

        <div class="summary-grid">

            <div class="summary total-box">
                <div class="summary-title">Total Pendapatan</div>
                <div class="summary-value" id="totalSales">
                    Rp0
                </div>
            </div>

            <div class="summary cash-box">
                <div class="summary-title">Cash</div>
                <div class="summary-value" id="totalCash">
                    Rp0
                </div>
            </div>

            <div class="summary qris-box">
                <div class="summary-title">QRIS</div>
                <div class="summary-value" id="totalQris">
                    Rp0
                </div>
            </div>

        </div>

        <div class="transaction-count mt-3">
            <span id="transactionCount">0</span> transaksi
        </div>

    </div>


    <!-- TRANSACTION LIST -->
    <div id="transactionSection" class="report-card d-none">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">
                Daftar Transaksi
            </h5>
        </div>

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>
                    <tr>
                        <th>Nota</th>
                        <th>Jam</th>
                        <th>Pembayaran</th>
                        <th class="text-end">Total</th>
                    </tr>
                </thead>

                <tbody id="transactionTable">
                </tbody>

            </table>

        </div>

    </div>


    <!-- LOADING -->
    <div id="loadingSection" class="report-card d-none">
        <div class="loading">
            <div class="spinner-border mb-3"></div>
            <div>Mengambil data...</div>
        </div>
    </div>


    <!-- EMPTY -->
    <div id="emptySection" class="report-card d-none">
        <div class="empty">
            <div style="font-size:40px;">📊</div>
            <h5 class="mt-3">Tidak ada transaksi</h5>
            <div>Tidak ditemukan transaksi pada tanggal tersebut.</div>
        </div>
    </div>

</div>


<script>

/* =========================================================
   GOOGLE DATA URL
========================================================= */

const DATA_URL =
"https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQhfjZlQg8nJ6wFV8S_giqK637TI7uDabf4UHcVHRvtfAFo3OmHUXk7QQkPWq0v9XcXlYkvKaj9GCNpMdX571e667ynjk3IRFHltHPDtmaSj4VKS6o7X4tO6mxiq7gwxBx_YLCosq4yZs_BSFXUC-liAzi_5rnfQwofbLcR7IsPjHSlqALNKMFsGGuIsjrc7IlhtxRjueJk9F2q87tTVnR4K3iBAFpjlqZpAvY3IfREIQZfL9IFaXyFUAknf6Uu2y78TS0A_EEknFaRparTu4tSgo24EQ&lib=MbNqoalhwzmfLgZVjC4XyNX6DnvbZbUGR";


/* =========================================================
   HARGA PRODUK
========================================================= */

const PRODUCT_PRICES = {

    "Cheesecake A": 40000,
    "Cheesecake B": 55000,

    "Dubai Chewy Cookie": 50000,
    "Strawberry Dubai Choco": 95000,

    "London Choco Cake": 55000,

    "Mooncake Pudding": 40000,
    "Milk Cheese Bread": 25000,
    "Bakwan Goreng": 40000,
    "Risol": 5000,

    "Scoopable Nutella": 40000,
    "Scoopable Kunafa": 55000,

    "Bagia Ori / Mocha": 35000,
    "Bagia Kacang": 45000
};


/* =========================================================
   FORMAT RUPIAH
========================================================= */

function rupiah(value) {

    return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
    }).format(value || 0);

}


/* =========================================================
   FORMAT TANGGAL
========================================================= */

function normalizeDate(value) {

    if (!value) return "";

    let str = String(value).trim();

    /*
       API:
       17/9/2026
    */

    let parts = str.split("/");

    if (parts.length === 3) {

        let day = parts[0].padStart(2, "0");
        let month = parts[1].padStart(2, "0");
        let year = parts[2];

        return `${year}-${month}-${day}`;
    }

    return str;
}


/* =========================================================
   FORMAT JAM
========================================================= */

function formatTime(value) {

    if (value === null || value === undefined || value === "") {
        return "-";
    }

    let str = String(value);

    /*
       Contoh API:

       12.33
       = 12:33

       14
       = 14:00

       16.5
       = 16:50
    */

    let number = Number(value);

    if (!isNaN(number)) {

        let hour = Math.floor(number);

        let decimal = number - hour;

        let minute = Math.round(decimal * 100);

        if (minute > 59) {
            minute = Math.round(decimal * 60);
        }

        return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
    }

    return str;
}


/* =========================================================
   PARSE HARGA
========================================================= */

function getProductPrice(productName) {

    if (!productName) return 0;

    return PRODUCT_PRICES[productName] || 0;
}


/* =========================================================
   HITUNG SUBTOTAL BARIS
========================================================= */

function calculateRow(row) {

    const product = String(row.rincian || "").trim();

    const qty = Number(row.total) || 0;

    const price = getProductPrice(product);

    return qty * price;
}


/* =========================================================
   LOAD DATA
========================================================= */

async function fetchData() {

    const response = await fetch(DATA_URL);

    if (!response.ok) {
        throw new Error("Gagal mengambil data.");
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
        throw new Error("Format data tidak valid.");
    }

    return data;
}


/* =========================================================
   GROUP TRANSACTIONS
========================================================= */

function groupTransactions(data, selectedDate) {

    /*
       Karena field "nota" dari API saat ini berisi tanggal,
       kita gunakan:

       tanggal + jam + pembayaran

       sebagai ID transaksi.

       Contoh:

       17/9/2026 + 12.33 + QRIS
       = 1 transaksi

       17/9/2026 + 13.42 + Cash
       = transaksi berikutnya
    */

    const filtered = data.filter(row => {

        const rowDate = normalizeDate(row.nota);

        return rowDate === selectedDate;

    });


    const groups = new Map();


    filtered.forEach(row => {

        const date = normalizeDate(row.nota);

        const timeValue = Number(row.tanggal);

        const payment = String(
            row.pembayaran || ""
        ).trim().toUpperCase();


        const key =
            `${date}|${timeValue}|${payment}`;


        if (!groups.has(key)) {

            groups.set(key, {

                date: date,

                time: timeValue,

                payment: payment,

                total: 0,

                items: []

            });

        }


        const transaction = groups.get(key);

        const subtotal = calculateRow(row);

        transaction.total += subtotal;

        transaction.items.push({

            product: row.rincian,

            qty: Number(row.total) || 0,

            price: getProductPrice(row.rincian),

            subtotal: subtotal

        });

    });


    return Array.from(groups.values())
        .sort((a, b) => {

            return a.time - b.time;

        });

}


/* =========================================================
   LOAD REPORT
========================================================= */

async function loadReport() {

    const date = document.getElementById("datePicker").value;


    if (!date) {

        alert("Silakan pilih tanggal terlebih dahulu.");

        return;

    }


    hideAllSections();

    document
        .getElementById("loadingSection")
        .classList.remove("d-none");


    try {

        const data = await fetchData();

        const transactions =
            groupTransactions(data, date);


        document
            .getElementById("loadingSection")
            .classList.add("d-none");


        if (transactions.length === 0) {

            document
                .getElementById("emptySection")
                .classList.remove("d-none");

            return;
        }


        renderSummary(transactions, date);

        renderTransactions(transactions);


    } catch (error) {

        document
            .getElementById("loadingSection")
            .classList.add("d-none");


        console.error(error);

        alert(
            "Gagal mengambil data laporan.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   SUMMARY
========================================================= */

function renderSummary(transactions, date) {

    let total = 0;

    let cash = 0;

    let qris = 0;


    transactions.forEach(transaction => {

        total += transaction.total;


        if (transaction.payment === "CASH") {

            cash += transaction.total;

        }


        if (transaction.payment === "QRIS") {

            qris += transaction.total;

        }

    });


    document.getElementById("totalSales")
        .textContent = rupiah(total);


    document.getElementById("totalCash")
        .textContent = rupiah(cash);


    document.getElementById("totalQris")
        .textContent = rupiah(qris);


    document.getElementById("transactionCount")
        .textContent = transactions.length;


    document.getElementById("reportDate")
        .textContent = formatDisplayDate(date);


    document
        .getElementById("summarySection")
        .classList.remove("d-none");

}


/* =========================================================
   TRANSACTION TABLE
========================================================= */

function renderTransactions(transactions) {

    const tbody =
        document.getElementById("transactionTable");


    tbody.innerHTML = "";


    transactions.forEach((transaction, index) => {

        const tr =
            document.createElement("tr");


        const paymentBadge =
            transaction.payment === "QRIS"

                ? `<span class="badge badge-qris">QRIS</span>`

                : `<span class="badge badge-cash">Cash</span>`;


        tr.innerHTML = `

            <td>
                <strong>Nota ${index + 1}</strong>
            </td>

            <td>
                ${formatTime(transaction.time)}
            </td>

            <td>
                ${paymentBadge}
            </td>

            <td class="text-end fw-bold">
                ${rupiah(transaction.total)}
            </td>

        `;


        tbody.appendChild(tr);

    });


    document
        .getElementById("transactionSection")
        .classList.remove("d-none");

}


/* =========================================================
   DISPLAY DATE
========================================================= */

function formatDisplayDate(dateString) {

    const date = new Date(dateString + "T00:00:00");


    return new Intl.DateTimeFormat("id-ID", {

        day: "numeric",

        month: "long",

        year: "numeric"

    }).format(date);

}


/* =========================================================
   HIDE SECTIONS
========================================================= */

function hideAllSections() {

    document
        .getElementById("summarySection")
        .classList.add("d-none");


    document
        .getElementById("transactionSection")
        .classList.add("d-none");


    document
        .getElementById("loadingSection")
        .classList.add("d-none");


    document
        .getElementById("emptySection")
        .classList.add("d-none");

}


/* =========================================================
   DEFAULT DATE
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    const today =
        new Date();

    const year =
        today.getFullYear();

    const month =
        String(today.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(today.getDate())
            .padStart(2, "0");


    document.getElementById("datePicker").value =
        `${year}-${month}-${day}`;

});

</script>

</body>
</html>
