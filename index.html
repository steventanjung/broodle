<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kukikoe - Mooncake</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #f8f9fa;
    }

    .menu-card {
      cursor: pointer;
      transition: 0.15s;
      height: 100%;
    }

    .menu-card:hover {
      transform: translateY(-2px);
    }

    .menu-card:active {
      transform: scale(0.98);
    }

    .cart-box {
      position: sticky;
      top: 15px;
    }

    .receipt {
      display: none;
    }

    @media print {
      body * {
        visibility: hidden !important;
      }

      #receipt,
      #receipt * {
        visibility: visible !important;
      }

      #receipt {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 80mm;
      }
    }
  </style>
</head>

<body>

<div class="container-fluid py-3">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h3 class="fw-bold mb-0">Kukikoe</h3>
      <small class="text-muted">Mooncake Festival</small>
    </div>

    <div class="d-flex align-items-center gap-2">
      <span id="networkBadge" class="badge bg-success">
        Online
      </span>

      <span class="badge bg-dark">

      </span>
    </div>
  </div>

  <div class="row g-3">

    <!-- MENU -->
    <div class="col-lg-8">

      <div class="card shadow-sm">
        <div class="card-body">

            <button
              class="btn btn-sm btn-dark category-btn"
              data-category="all"
              onclick="filterCategory('all')">
              Semua
            </button>

            <button
              class="btn btn-sm btn-outline-dark category-btn"
              data-category="featured"
              onclick="filterCategory('featured')">
              Favorit
            </button>

            <button
              class="btn btn-sm btn-outline-dark category-btn"
              data-category="Cheesecake"
              onclick="filterCategory('Cheesecake')">
              Cheesecake
            </button>

            <button
              class="btn btn-sm btn-outline-dark category-btn"
              data-category="Dubai"
              onclick="filterCategory('Dubai')">
              Dubai
            </button>

            <button
              class="btn btn-sm btn-outline-dark category-btn"
              data-category="Choco"
              onclick="filterCategory('Choco')">
              Choco
            </button>

            <button
              class="btn btn-sm btn-outline-dark category-btn"
              data-category="Snack"
              onclick="filterCategory('Snack')">
              Snack
            </button>

            <button
              class="btn btn-sm btn-outline-dark category-btn"
              data-category="Bagia"

            </button>
          </div>

          <div id="menuContainer" class="row g-2"></div>

        </div>
      </div>

    </div>

    <!-- CART -->
    <div class="col-lg-4">

      <div class="cart-box">

        <div class="card shadow-sm">
          <div class="card-body">

            <h5 class="fw-bold mb-3">Keranjang</h5>

            <div id="cartContainer">
              <div class="text-muted text-center py-4">
                Belum ada pesanan
              </div>
            </div>

            <hr>

            <div class="d-flex justify-content-between">
              <span class="fw-bold">Total</span>
              <span id="totalDisplay" class="fw-bold fs-4">
                Rp0
              </span>
            </div>

            <hr>

            <!-- PAYMENT -->
            <div class="mb-3">
              <label class="form-label fw-semibold">
                Pembayaran
              </label>

              <select
                id="paymentMethod"
                class="form-select"
                onchange="paymentChanged()">
                <option value="Cash">Cash</option>
                <option value="QRIS">QRIS</option>
              </select>
            </div>

            <div id="cashSection">

              <div class="mb-3">
                <label class="form-label fw-semibold">
                  Uang Diterima

                <input

                  id="cashReceived"
                  class="form-control form-control-lg"
                  value="0"
                  min="0"
                  oninput="calculateChange()"
                >
              </div>

              <div class="d-flex justify-content-between mb-3">
                <span>Kembalian</span>
                <span
                  id="changeDisplay"
                  class="fw-bold text-success">
                  Rp0
                </span>
              </div>

            </div>

            <button
              id="completeButton"
              class="btn btn-success btn-lg w-100"
              onclick="completeTransaction()">
              Selesaikan & Print
            </button>

          </div>
        </div>

      </div>

    </div>

  </div>

</div>


<!-- RECEIPT -->
<div id="receipt" class="receipt"></div>


<script>

const GOOGLE_SCRIPT_URL =

const CLEAN_TER_URL =
  "http://localhost:9100/print";

const MENU_VERSION = "12";

const DEFAULT_MENUS = [
  {

    harga: 40000,
    kategori: "Cheesecake",
    featured: true
  },
  {

  },

  },

let cart = {};

let nota =

let currentTransaction = null;

let transactionProcessing = false;

let pendingTransactions =

let syncingTransactions = false;

let currentCategory = "all";


/* =========================
   UTILITIES
========================= */

function rupiah(number) {

  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }
  ).format(number || 0);

}


function getMenus() {

  const saved =
    localStorage.getItem("menus");

  const savedVersion =
    localStorage.getItem("menuVersion");

  if (
    saved &&
    savedVersion === MENU_VERSION
  ) {

    try {
      return JSON.parse(saved);
    } catch (e) {
      console.error(e);
    }

  }

  localStorage.setItem(
    "menus",
    JSON.stringify(DEFAULT_MENUS)
  );

  localStorage.setItem(
    "menuVersion",
    MENU_VERSION
  );

  return DEFAULT_MENUS;
}


let menus = getMenus();


/* =========================
   PENDING TRANSACTIONS
========================= */

function loadPendingTransactions() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "pendingTransactions"
      )
    ) || [];

  } catch (error) {

    return [];

  }

}


function savePendingTransactions() {

  localStorage.setItem(
    "pendingTransactions",
    JSON.stringify(
      pendingTransactions
    )
  );

}


function queueTransactionLocally(transaction) {

  const exists =
    pendingTransactions.some(
      item =>
        item.transactionId ===
        transaction.transactionId
    );

  if (!exists) {

    pendingTransactions.push(
      transaction
    );

    savePendingTransactions();

  }

}


/* =========================
   MENU
========================= */

function renderMenu() {

  const container =
    document.getElementById(
      "menuContainer"
    );

  container.innerHTML = "";

  let filtered = menus;

  if (currentCategory === "featured") {

    filtered =
      menus.filter(
        menu => menu.featured
      );

  } else if (
    currentCategory !== "all"
  ) {

    filtered =
      menus.filter(
        menu =>
          menu.kategori ===
          currentCategory
      );

  }


  filtered.forEach(menu => {

    const col =
      document.createElement("div");

    col.className =
      "col-6 col-md-4 col-xl-3";


    col.innerHTML = `

      <div
        class="card menu-card shadow-sm"
        onclick="addToCart('${escapeHtml(menu.nama)}')">

        <div class="card-body">

          <div class="fw-bold">
            ${escapeHtml(menu.nama)}
          </div>

          <div class="text-success fw-semibold mt-2">
            ${rupiah(menu.harga)}
          </div>

          <small class="text-muted">
            ${escapeHtml(menu.kategori)}
          </small>

        </div>

      </div>

    `;

    container.appendChild(col);

  });

}


function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function filterCategory(category) {

  currentCategory = category;

  document
    .querySelectorAll(
      ".category-btn"
    )
    .forEach(button => {

      const active =
        button.dataset.category ===
        category;

      button.classList.toggle(
        "btn-dark",
        active
      );

      button.classList.toggle(
        "btn-outline-dark",
        !active
      );

    });

  renderMenu();

}


/* =========================
   CART
========================= */

function addToCart(name) {

  const menu =
    menus.find(
      item => item.nama === name
    );

  if (!menu) return;


  if (!cart[name]) {

    cart[name] = {
      nama: menu.nama,
      harga: menu.harga,
      qty: 0
    };

  }

  cart[name].qty++;

  renderCart();

}


function decreaseCart(name) {

  if (!cart[name]) return;

  cart[name].qty--;

  if (cart[name].qty <= 0) {

    delete cart[name];

  }

  renderCart();

}


function increaseCart(name) {

  if (!cart[name]) return;

  cart[name].qty++;

  renderCart();

}


function getTotal() {

  return Object.values(cart)
    .reduce(
      (total, item) =>
        total +
        item.harga *
        item.qty,
      0
    );

}


function renderCart() {

  const container =
    document.getElementById(
      "cartContainer"
    );

  const items =
    Object.values(cart);


  if (items.length === 0) {

    container.innerHTML = `
      <div class="text-muted text-center py-4">
        Belum ada pesanan
      </div>
    `;

  } else {

    container.innerHTML = "";

    items.forEach(item => {

      const row =
        document.createElement("div");

      row.className =
        "border-bottom pb-2 mb-2";

      row.innerHTML = `

        <div class="d-flex justify-content-between">

          <div>
            <div class="fw-semibold">
              ${escapeHtml(item.nama)}
            </div>

            <small class="text-muted">
              ${rupiah(item.harga)}
            </small>
          </div>

          <div class="text-end">

            <div class="btn-group btn-group-sm">

              <button
                class="btn btn-outline-secondary"
                onclick="decreaseCart('${escapeHtml(item.nama)}')">
                −
              </button>

              <button
                class="btn btn-outline-secondary disabled">
                ${item.qty}
              </button>

              <button
                class="btn btn-outline-secondary"
                onclick="increaseCart('${escapeHtml(item.nama)}')">
                +
              </button>

            </div>

            <div class="fw-semibold mt-1">
              ${rupiah(
                item.harga *
                item.qty
              )}
            </div>

          </div>

        </div>

      `;

      container.appendChild(row);

    });

  }


  document.getElementById(
    "totalDisplay"
  ).textContent =
    rupiah(getTotal());

  calculateChange();

}


/* =========================
   PAYMENT
========================= */

function paymentChanged() {

  const method =
    document.getElementById(
      "paymentMethod"
    ).value;

  const cashSection =
    document.getElementById(
      "cashSection"
    );


  if (method === "Cash") {

    cashSection.style.display =
      "block";

  } else {

    cashSection.style.display =
      "none";

  }

  calculateChange();

}


function calculateChange() {

  const method =
    document.getElementById(
      "paymentMethod"
    ).value;

  const total =
    getTotal();

  const cash =
    parseInt(
      document.getElementById(
        "cashReceived"
      ).value
    ) || 0;


  if (method !== "Cash") {

    document.getElementById(
      "changeDisplay"
    ).textContent =
      rupiah(0);

    return;

  }


  const change =
    Math.max(
      cash - total,
      0
    );


  document.getElementById(
    "changeDisplay"
  ).textContent =
    rupiah(change);

}


function resetPaymentForm() {

  document.getElementById(
    "cashReceived"
  ).value = "0";

  document.getElementById(
    "paymentMethod"
  ).value = "Cash";

  paymentChanged();

}

/* =========================
   DIRECT CLEANTER PRINT
========================= */

async function printReceipt() {

  const receipt =
    document.getElementById(
      "receipt"
    );


  try {

    receipt.style.display =
      "block";


    if (!currentTransaction) {

      throw new Error(
        "Transaksi tidak tersedia"
      );

    }


    /*
      CleanTer menerima isi nota
      langsung dari web app.
      Tidak menggunakan window.print().
    */

    const lines = [];

    lines.push("KUKIKOE");
    lines.push("Mooncake Festival");
    lines.push("------------------------------");

    lines.push(
      "Nota: " +
      currentTransaction.nota
    );

    lines.push(
      currentTransaction.tanggal +
      " " +
      currentTransaction.jam
    );

    lines.push("------------------------------");


    currentTransaction.items
      .forEach(item => {

        lines.push(
          item.nama
        );

        lines.push(
          item.qty +
          " x " +
          rupiah(item.harga) +
          " = " +
          rupiah(item.subtotal)
        );

      });


    lines.push(
      "------------------------------"
    );

    lines.push(
      "TOTAL: " +
      rupiah(
        currentTransaction.total
      )
    );


    lines.push(
      "Pembayaran: " +
      currentTransaction.pembayaran
    );


    if (
      currentTransaction.pembayaran ===
      "Cash"
    ) {

      lines.push(
        "Bayar: " +
        rupiah(
          currentTransaction.cashReceived
        )
      );

      lines.push(
        "Kembali: " +
        rupiah(
          currentTransaction.change
        )
      );

    }


    lines.push(
      "------------------------------"
    );

    lines.push(
      "Terima Kasih"
    );


    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () => controller.abort(),
        5000
      );


    const response =
      await fetch(
        CLEAN_TER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            content: lines,
            cut: true
          }),

          signal:
            controller.signal
        }
      );


    clearTimeout(timeout);


    if (!response.ok) {

      throw new Error(
        "CleanTer HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "CleanTer response:",
      result
    );


    if (
      result &&
      result.status ===
      "printed"
    ) {

      return true;

    }


    throw new Error(
      result?.message ||
      "Printer tidak menerima perintah"
    );


  } catch (error) {

    console.error(
      "Print error:",
      error
    );


    alert(
      "Print gagal. Pastikan CleanTer aktif."
    );


    return false;


  } finally {

    receipt.style.display =
      "none";

  }

}


/* =========================
   TRANSACTION
========================= */

function createTransaction() {

  const items =
    Object.values(cart)
      .map(item => ({
        nama: item.nama,
        qty: item.qty,
        harga: item.harga,
        subtotal:
          item.harga *
          item.qty
      }));


  const total =
    items.reduce(
      (sum, item) =>
        sum + item.subtotal,
      0
    );


  const paymentMethod =
    document.getElementById(
      "paymentMethod"
    ).value;


  const cashReceived =
    parseInt(
      document.getElementById(
        "cashReceived"
      ).value
    ) || 0;


  const now =
    new Date();


  const tanggal =
    now.toLocaleDateString(
      "id-ID"
    );


  const jam =
    now.toLocaleTimeString(
      "id-ID",
      {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }
    );


  /*
    ID stabil.
    Kalau transaksi yang sama
    dikirim ulang ke Google Sheets,
    ID ini tetap sama.
  */

  const transactionId =
    "KUKIKOE-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 8);


  return {

    transactionId,

    nota,

    tanggal,

    jam,

    pembayaran:
      paymentMethod,

    cashReceived:
      paymentMethod === "Cash"
        ? cashReceived
        : 0,

    change:
      paymentMethod === "Cash"
        ? Math.max(
            cashReceived -
            total,
            0
          )
        : 0,

    items,

    total

  };

}


async function completeTransaction() {

  if (transactionProcessing) {
    return;
  }


  if (
    Object.keys(cart).length ===
    0
  ) {

    alert(
      "Keranjang masih kosong."
    );

    return;

  }


  const total =
    getTotal();


  const paymentMethod =
    document.getElementById(
      "paymentMethod"
    ).value;


  const cashReceived =
    parseInt(
      document.getElementById(
        "cashReceived"
      ).value
    ) || 0;


  if (
    paymentMethod === "Cash" &&
    cashReceived < total
  ) {

    alert(
      "Uang diterima kurang."
    );

    return;

  }


  transactionProcessing = true;


  const button =
    document.getElementById(
      "completeButton"
    );


  button.disabled = true;

  button.textContent =
    "Mencetak...";


  try {

    /*
      Buat transaksi.
    */

    currentTransaction =
      createTransaction();


    /*
      SIMPAN LOKAL DULU.

      Ini dilakukan SEBELUM print.
      Jadi kalau internet mati,
      transaksi tetap aman.
    */

    queueTransactionLocally(
      currentTransaction
    );


    /*
      Generate nota.
    */

    generateReceipt(
      currentTransaction
    );


    /*
      LANGSUNG PRINT KE CLEANTER.

      Tidak menunggu Google Sheets.
    */

    const printSuccess =
      await printReceipt();


    if (!printSuccess) {

      /*
        Transaksi sengaja tidak
        dihapus dari queue.
      */

      return;

    }


    /*
      PRINT BERHASIL.
      Baru reset transaksi.
    */

    nota++;

    localStorage.setItem(
      "nota",
      nota
    );


    cart = {};

    currentTransaction = null;


    resetPaymentForm();

    renderCashier();


    /*
      Google Sheets berjalan
      setelah print berhasil.
      Tidak menghambat kasir.
    */

    if (navigator.onLine) {

      processPendingTransactions();

    }


  } catch (error) {

    console.error(
      "Transaction error:",
      error
    );

    alert(
      "Transaksi gagal diproses."
    );

  } finally {

    transactionProcessing =
      false;

    button.disabled = false;

    button.textContent =
      "Selesaikan & Print";

  }

}


/* =========================
   RENDER CASHIER
========================= */

function renderCashier() {

  document.getElementById(
    "notaDisplay"
  ).textContent =
    nota;


  renderMenu();

  renderCart();

  resetPaymentForm();

}


/* =========================
   GOOGLE SHEETS SYNC
========================= */

async function processPendingTransactions() {

  if (
    syncingTransactions ||
    pendingTransactions.length === 0 ||
    !navigator.onLine
  ) {

    return;

  }


  syncingTransactions =
    true;


  try {

    const transactionToSend =
      pendingTransactions[0];


    await fetch(
      GOOGLE_SCRIPT_URL,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            transactionToSend
          )
      }
    );


    /*
      Karena request sudah
      berhasil dikirim ke endpoint,
      keluarkan dari queue.
    */

    pendingTransactions.shift();

    savePendingTransactions();

    updateNetworkStatus();


  } catch (error) {

    console.error(
      "Gagal sync ke Google Sheets:",
      error
    );

  } finally {

    syncingTransactions =
      false;

  }

}


/* =========================
   NETWORK STATUS
========================= */

function updateNetworkStatus() {

  const badge =
    document.getElementById(
      "networkBadge"
    );


  if (navigator.onLine) {

    badge.textContent =
      "Online";

    badge.className =
      "badge bg-success";

  } else {

    badge.textContent =
      "Offline";

    badge.className =
      "badge bg-danger";

  }

}


/* =========================
   EVENTS
========================= */

window.addEventListener(
  "online",
  () => {

    updateNetworkStatus();

    processPendingTransactions();

  }
);


window.addEventListener(
  "offline",
  () => {

    updateNetworkStatus();

  }
);


/*
  Coba sync background setiap
  15 detik kalau ada transaksi
  yang belum terkirim.
*/

setInterval(
  () => {

    if (navigator.onLine) {

      processPendingTransactions();

    }

  },
  15000
);


/* =========================
   START
========================= */

renderCashier();

updateNetworkStatus();

</script>
