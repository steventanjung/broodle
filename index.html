<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<title>Kukikoe - Mooncake</title>


<style>

/* =========================
   LOADING
   ========================= */

.loadingBox{
display:none;
text-align:center;
padding:20px 10px;
}

.loadingBox.active{
display:block;
}

.spinner{
width:40px;
height:40px;
border:4px solid #dee2e6;
border-top:4px solid #0d6efd;
border-radius:50%;
animation:spin .8s linear infinite;
margin:0 auto 12px;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

.loadingText{
font-weight:bold;
}

.loadingSub{
font-size:13px;
color:#6c757d;
margin-top:4px;
}


/* =========================
   GENERAL
   ========================= */

*{
box-sizing:border-box;
}

body{
background:#f5f6f8;
font-family:Arial,sans-serif;
padding:12px;
margin:0;
color:#212529;
}

.page{
display:none;
}

.page.active{
display:block;
}

.card{
background:#fff;
border:0;
border-radius:16px;
padding:16px;
margin-bottom:14px;
box-shadow:0 3px 12px rgba(0,0,0,.07);
}


/* =========================
   MENU ITEM
   ========================= */

.menuItem{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
background:#fff;
border:1px solid #e9ecef;
border-radius:12px;
padding:13px;
margin-bottom:8px;
}

.menuItem b{
font-size:15px;
}


/* =========================
   QTY
   ========================= */

.qtyBox{
display:flex;
align-items:center;
gap:8px;
flex-shrink:0;
}

.qtyBtn{
width:38px;
height:38px;
border:0;
border-radius:50%;
padding:0;
margin:0;
font-size:20px;
font-weight:bold;
background:#e9ecef;
}

.qtyBox span{
min-width:25px;
text-align:center;
font-weight:bold;
}


/* =========================
   PAYMENT
   ========================= */

.paymentBox{
margin-top:16px;
padding-top:16px;
border-top:1px solid #e9ecef;
}

.change{
font-size:18px;
font-weight:bold;
margin-top:10px;
padding:12px;
background:#f8f9fa;
border-radius:10px;
}

#grandTotal{
margin:0;
}


/* =========================
   RECEIPT
   ========================= */

#receipt{
width:58mm;
background:white;
padding:10px;
font-size:12px;
display:none;
}

.center{
text-align:center;
}

.right{
text-align:right;
}

.line{
border-top:1px dashed black;
margin:6px 0;
}

.hidden{
display:none !important;
}


/* =========================
   PRINT
   ========================= */

@media print{

body *{
visibility:hidden;
}

#receipt,
#receipt *{
visibility:visible;
}

#receipt{
position:absolute;
left:0;
top:0;
width:58mm;
}

}

</style>

</head>


<body>


<!-- =====================================================
     NAVIGASI
     ===================================================== -->

<div class="nav">

<button
style="display:none;"
onclick="showPage('menuPage')">

Kelola Menu

</button>


<button
class="hidden"
style="display:none;"
onclick="showPage('cashierPage');renderCashier();">

REFRESH

</button>

</div>



<!-- =====================================================
     MENU
     ===================================================== -->

<div
id="menuPage"
class="page">

<div class="card">

<h2>Tambah Menu</h2>

<input
id="nama"
class="form-control mb-2"
placeholder="Nama Barang">

<input
id="harga"
class="form-control mb-2"
type="number"
placeholder="Harga">

<button
class="btn btn-primary"
onclick="addMenu()">

Tambah

</button>

</div>


<div class="card">

<h3>Daftar Menu</h3>

<div id="menuList"></div>

</div>

</div>



<!-- =====================================================
     KASIR
     ===================================================== -->

<div
id="cashierPage"
class="page active">

<div class="card">


<div class="mb-3">

<h2 class="fw-bold mb-1">
Kukikoe
</h2>

<div class="text-muted">
Mooncake & Dessert
</div>

</div>


<div
class="d-flex justify-content-between align-items-center mb-3">

<h5 class="fw-bold mb-0">
Daftar Produk
</h5>

<span class="badge text-bg-secondary">
Kasir
</span>

</div>


<div id="cashierList"></div>


<div class="alert alert-primary mt-3 mb-0">

<div class="small text-muted">
TOTAL PEMBAYARAN
</div>

<h2
id="grandTotal"
class="fw-bold mb-0">

Total : Rp0

</h2>

</div>



<!-- =========================
     PEMBAYARAN
     ========================= -->

<div class="paymentBox">

<h5 class="fw-bold mb-3">
Pembayaran
</h5>


<label class="form-label">
Metode Pembayaran
</label>


<select
id="paymentMethod"
class="form-select"
onchange="paymentChanged()">

<option value="cash">
Cash
</option>

<option value="qris">
QRIS
</option>

</select>



<!-- CASH -->

<div
id="cashPayment"
class="mt-3">

<label class="form-label">
Uang Diterima
</label>


<input
id="cashReceived"
class="form-control form-control-lg"
type="number"
placeholder="Masukkan nominal"
oninput="calculateChange()">


<div
id="changeDisplay"
class="change">

Kembalian : Rp0

</div>

</div>



<!-- QRIS -->

<div
id="qrisPayment"
class="alert alert-info mt-3"
style="display:none;">

<strong>
Pembayaran QRIS
</strong>

<div class="small mt-1">

Pastikan pembayaran sudah diterima
sebelum menyelesaikan transaksi.

</div>

</div>



<!-- =========================
     TOMBOL TRANSAKSI
     ========================= -->

<button
id="completeButton"
class="btn btn-primary btn-lg w-100 mt-3"
onclick="completeTransaction()">

🧾 Selesaikan & Print

</button>


<!-- =========================
     LOADING
     ========================= -->

<div
id="loadingBox"
class="loadingBox">

<div class="spinner"></div>

<div
id="loadingText"
class="loadingText">

Memproses transaksi...

</div>

<div
id="loadingSub"
class="loadingSub">

Mohon tunggu

</div>

</div>


</div>

</div>

</div>



<!-- =====================================================
     NOTA
     ===================================================== -->

<div id="receipt">


<div class="center">

<b>KUKIKOE</b>

<br>

Mooncake Festival

</div>


<div class="line"></div>


<!-- INFO NOTA -->

<div
id="receiptInfo"
class="center">

</div>


<div class="line"></div>


<!-- ITEM -->

<div id="receiptItems"></div>


<div class="line"></div>


<!-- TOTAL -->

<div class="right">

<b id="receiptTotal"></b>

</div>


<div class="line"></div>


<!-- PEMBAYARAN -->

<div id="receiptPayment"></div>


<div class="line"></div>


<div class="center">

Terima Kasih

</div>


</div>



<script>


/* =====================================================
   GOOGLE SHEETS
   ===================================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwyKe1AdCJG-rRFJqQlM9u5odQKUSPUirskaqPriC63vVm7IEIgaEXkeKnm1nUdap47/exec";



/* =====================================================
   DATA
   ===================================================== */

let cart={};

let nota =
parseInt(
localStorage.getItem("nota")
) || 1;

let currentTransaction=null;

let transactionProcessing=false;



/* =====================================================
   MENU VERSION
   ===================================================== */

const MENU_VERSION="2";


const DEFAULT_MENUS=[

{
nama:"Cheesecake A",
harga:40000
},

{
nama:"Cheesecake B",
harga:55000
},

{
nama:"Dubai Chewy Cookie",
harga:50000
},

{
nama:"Strawberry Dubai Choco",
harga:95000
},

{
nama:"London Choco Cake",
harga:55000
},

{
nama:"Mooncake Pudding",
harga:40000
}

];


let menus =
JSON.parse(
localStorage.getItem("menus")
);


let savedMenuVersion =
localStorage.getItem("menuVersion");



/* =====================================================
   UPDATE MENU
   ===================================================== */

if(
savedMenuVersion !== MENU_VERSION
){

menus =
DEFAULT_MENUS.map(
menu=>({

nama:menu.nama,
harga:menu.harga

})
);


localStorage.setItem(
"menus",
JSON.stringify(menus)
);


localStorage.setItem(
"menuVersion",
MENU_VERSION
);

}



/* =====================================================
   JIKA MENU KOSONG
   ===================================================== */

if(
!Array.isArray(menus) ||
menus.length===0
){

menus =
DEFAULT_MENUS.map(
menu=>({

nama:menu.nama,
harga:menu.harga

})
);


localStorage.setItem(
"menus",
JSON.stringify(menus)
);


localStorage.setItem(
"menuVersion",
MENU_VERSION
);

}



/* =====================================================
   SAVE
   ===================================================== */

function save(){

localStorage.setItem(
"menus",
JSON.stringify(menus)
);

}



/* =====================================================
   PAGE
   ===================================================== */

function showPage(id){

document
.querySelectorAll(".page")
.forEach(
p=>p.classList.remove("active")
);


document
.getElementById(id)
.classList.add("active");

}



/* =====================================================
   RUPIAH
   ===================================================== */

function rupiah(n){

return "Rp"+
Number(n).toLocaleString("id-ID");

}



/* =====================================================
   MENU
   ===================================================== */

function addMenu(){

let nama =
document
.getElementById("nama")
.value
.trim();


let harga =
parseInt(
document
.getElementById("harga")
.value
);


if(
nama==="" ||
isNaN(harga)
){

alert(
"Lengkapi data"
);

return;

}


menus.push({

nama:nama,
harga:harga

});


save();


document
.getElementById("nama")
.value="";


document
.getElementById("harga")
.value="";


renderMenu();

}



/* =====================================================
   DELETE MENU
   ===================================================== */

function deleteMenu(index){

if(
!confirm("Hapus menu?")
){

return;

}


menus.splice(
index,
1
);


save();

renderMenu();

}



/* =====================================================
   EDIT MENU
   ===================================================== */

function editMenu(index){

let nama =
prompt(
"Nama Barang",
menus[index].nama
);


if(
nama===null
){

return;

}


let harga =
prompt(
"Harga",
menus[index].harga
);


if(
harga===null
){

return;

}


harga =
parseInt(harga);


if(
nama.trim()==="" ||
isNaN(harga)
){

alert(
"Data tidak valid"
);

return;

}


menus[index].nama =
nama.trim();

menus[index].harga =
harga;


save();

renderMenu();

}



/* =====================================================
   RENDER MENU
   ===================================================== */

function renderMenu(){

let html="";


menus.forEach(
(m,i)=>{

html+=`

<div class="menuItem">

<div>

<b>
${escapeHtml(m.nama)}
</b>

<br>

${rupiah(m.harga)}

</div>


<div>

<button
class="btn btn-sm btn-outline-primary"
onclick="editMenu(${i})">

Edit

</button>


<button
class="btn btn-sm btn-outline-danger"
onclick="deleteMenu(${i})">

Hapus

</button>

</div>

</div>

`;

});


document
.getElementById("menuList")
.innerHTML=html;

}



/* =====================================================
   RENDER KASIR
   ===================================================== */

function renderCashier(){

cart={};

let html="";


menus.forEach(
(m,i)=>{

cart[i]=0;


html+=`

<div class="menuItem">

<div>

<b>
${escapeHtml(m.nama)}
</b>

<br>

${rupiah(m.harga)}

</div>


<div class="qtyBox">

<button
class="qtyBtn"
onclick="minusQty(${i})">

-

</button>


<span id="qty${i}">
0
</span>


<button
class="qtyBtn"
onclick="plusQty(${i})">

+

</button>

</div>

</div>

`;

});


document
.getElementById("cashierList")
.innerHTML=html;


document
.getElementById("cashReceived")
.value="";


document
.getElementById("changeDisplay")
.innerText=
"Kembalian : Rp0";


updateTotal();


transactionProcessing=false;


document
.getElementById("completeButton")
.disabled=false;


document
.getElementById("loadingBox")
.classList.remove("active");


/* KEMBALIKAN METODE KE CASH */

document
.getElementById("paymentMethod")
.value="cash";


paymentChanged();

}



/* =====================================================
   PLUS
   ===================================================== */

function plusQty(index){

cart[index]++;


document
.getElementById("qty"+index)
.innerText=
cart[index];


updateTotal();

}



/* =====================================================
   MINUS
   ===================================================== */

function minusQty(index){

if(
cart[index]>0
){

cart[index]--;


document
.getElementById("qty"+index)
.innerText=
cart[index];


updateTotal();

}

}



/* =====================================================
   TOTAL
   ===================================================== */

function getTotal(){

let total=0;


menus.forEach(
(m,i)=>{

total +=
m.harga *
(cart[i] || 0);

});


return total;

}



function updateTotal(){

let total=
getTotal();


document
.getElementById("grandTotal")
.innerHTML=
"Total : <b>"+
rupiah(total)+
"</b>";


calculateChange();

}



/* =====================================================
   PEMBAYARAN
   ===================================================== */

function paymentChanged(){

let method=
document
.getElementById("paymentMethod")
.value;


if(
method==="cash"
){

document
.getElementById("cashPayment")
.style.display=
"block";


document
.getElementById("qrisPayment")
.style.display=
"none";

}else{

document
.getElementById("cashPayment")
.style.display=
"none";


document
.getElementById("qrisPayment")
.style.display=
"block";

}

}



/* =====================================================
   KEMBALIAN
   ===================================================== */

function calculateChange(){

let total=
getTotal();


let received=
parseInt(
document
.getElementById("cashReceived")
.value
) || 0;


let change=
received-total;


if(
change<0
){

change=0;

}


document
.getElementById("changeDisplay")
.innerText=
"Kembalian : "+
rupiah(change);

}



/* =====================================================
   SELESAIKAN + PRINT
   ===================================================== */

async function completeTransaction(){


/* ANTI DOUBLE CLICK */

if(
transactionProcessing
){

return;

}


transactionProcessing=true;


const button=
document
.getElementById("completeButton");

button.disabled=true;



/* =========================
   VALIDASI TOTAL
   ========================= */

let total=
getTotal();


if(
total<=0
){

transactionProcessing=false;

button.disabled=false;

alert(
"Belum ada barang dipilih"
);

return;

}



/* =========================
   PEMBAYARAN
   ========================= */

let paymentMethod=
document
.getElementById("paymentMethod")
.value;


let cashReceived=0;

let change=0;


if(
paymentMethod==="cash"
){

cashReceived=
parseInt(
document
.getElementById("cashReceived")
.value
) || 0;


if(
cashReceived<total
){

transactionProcessing=false;

button.disabled=false;

alert(

"Uang diterima kurang.\n\n"+
"Total: "+
rupiah(total)

);

return;

}


change=
cashReceived-total;

}



/* =========================
   ITEM
   ========================= */

let items=[];


menus.forEach(
(m,i)=>{

if(
cart[i]>0
){

let subtotal=
m.harga*cart[i];


items.push({

nama:m.nama,

qty:cart[i],

harga:m.harga,

subtotal:subtotal

});

}

});



/* =========================
   WAKTU
   ========================= */

let now=
new Date();


let tanggal=
now.toLocaleDateString(
"id-ID"
);


let jam=
now.toLocaleTimeString(
"id-ID"
);



/* =========================
   NOMOR NOTA
   ========================= */

let nomorNota=
String(nota)
.padStart(4,"0");



/* =========================
   TRANSAKSI
   ========================= */

let transaction={

tanggal:tanggal,

jam:jam,

nota:nomorNota,

pembayaran:
paymentMethod==="cash"
?"Cash"
:"QRIS",

cashReceived:
cashReceived,

change:
change,

total:
total,

items:
items

};


currentTransaction=
transaction;



/* =====================================================
   LOADING
   ===================================================== */

const loadingBox=
document
.getElementById("loadingBox");


const loadingText=
document
.getElementById("loadingText");


const loadingSub=
document
.getElementById("loadingSub");


loadingBox
.classList
.add("active");


loadingText.innerText=
"Mengirim transaksi...";


loadingSub.innerText=
"Menyimpan data ke Google Sheets";



/* =====================================================
   GOOGLE SHEETS
   ===================================================== */

try{

await saveToGoogleSheets(
transaction
);

}catch(error){

console.error(error);


let lanjut=
confirm(

"Transaksi gagal dikirim ke Google Sheets.\n\n"+
"Apakah tetap ingin mencetak nota?"

);


if(
!lanjut
){

loadingBox
.classList
.remove("active");


transactionProcessing=false;

button.disabled=false;

return;

}

}



/* =====================================================
   SIAP PRINT
   ===================================================== */

loadingText.innerText=
"Mencetak nota...";


loadingSub.innerText=
"Mengirim nota ke printer";



/* =====================================================
   GENERATE NOTA
   ===================================================== */

generateReceipt(
transaction
);



/* =====================================================
   PRINT OTOMATIS
   ===================================================== */

let printSuccess=
await printReceipt();


if(
!printSuccess
){

loadingBox
.classList
.remove("active");


transactionProcessing=false;

button.disabled=false;

return;

}



/* =====================================================
   NOMOR NOTA NAIK
   ===================================================== */

nota++;


localStorage.setItem(
"nota",
nota
);



/* =====================================================
   RESET
   ===================================================== */

document
.getElementById("receipt")
.style.display=
"none";


renderCashier();


alert(

"Transaksi berhasil.\n"+
"No Nota: "+
nomorNota

);

}



/* =====================================================
   GOOGLE SHEETS
   ===================================================== */

async function saveToGoogleSheets(
data
){

await fetch(

GOOGLE_SCRIPT_URL,

{

method:"POST",

mode:"no-cors",

headers:{

"Content-Type":
"text/plain;charset=utf-8"

},

body:
JSON.stringify(data)

}

);

}



/* =====================================================
   GENERATE NOTA
   ===================================================== */

function generateReceipt(
transaction
){

let itemHtml="";


transaction.items.forEach(
item=>{

itemHtml+=`

<div style="margin-bottom:6px;">

<div>

<b>
${escapeHtml(item.nama)}
</b>

</div>


<div
style="
display:flex;
justify-content:space-between;
">

<span>

${item.qty}
x
${rupiah(item.harga)}

</span>


<span>

${rupiah(item.subtotal)}

</span>

</div>

</div>

`;

});



/* =========================
   INFO RATA TENGAH
   ========================= */

document
.getElementById("receiptInfo")
.innerHTML=`

<div class="center">

No Nota : ${transaction.nota}

<br>

${transaction.tanggal}

<br>

${transaction.jam}

</div>

`;



/* =========================
   ITEM
   ========================= */

document
.getElementById("receiptItems")
.innerHTML=
itemHtml;



/* =========================
   TOTAL
   ========================= */

document
.getElementById("receiptTotal")
.innerHTML=
"TOTAL : "+
rupiah(transaction.total);



/* =========================
   PEMBAYARAN
   ========================= */

let paymentHtml="";


if(
transaction.pembayaran==="Cash"
){

paymentHtml=`

Pembayaran : Cash

<br>

Diterima :
${rupiah(transaction.cashReceived)}

<br>

Kembalian :
${rupiah(transaction.change)}

`;

}else{

paymentHtml=`

Pembayaran : QRIS

`;

}


document
.getElementById("receiptPayment")
.innerHTML=
paymentHtml;


document
.getElementById("receipt")
.style.display=
"block";

}



/* =====================================================
   PRINT RPP02N VIA CLEANTER
   ===================================================== */

async function printReceipt(){

if(
!currentTransaction
){

alert(
"Belum ada transaksi"
);

return false;

}


let transaction=
currentTransaction;


let content=[];



/* =========================
   HEADER
   ========================= */

content.push({

type:"text",

text:"KUKIKOE",

align:"center",

bold:true,

size:"large"

});


content.push({

type:"text",

text:"Mooncake Festival",

align:"center"

});


content.push({

type:"divider"

});



/* =========================
   INFO
   ========================= */

content.push({

type:"text",

text:
"No Nota : "+
transaction.nota,

align:"center"

});


content.push({

type:"text",

text:
transaction.tanggal,

align:"center"

});


content.push({

type:"text",

text:
transaction.jam,

align:"center"

});


content.push({

type:"divider"

});



/* =========================
   ITEM
   ========================= */

transaction.items.forEach(
item=>{

content.push({

type:"text",

text:item.nama,

bold:true

});


content.push({

type:"row",

left:
item.qty+
" x "+
rupiah(item.harga),

right:
rupiah(item.subtotal)

});

});



content.push({

type:"divider"

});



/* =========================
   TOTAL
   ========================= */

content.push({

type:"row",

left:"TOTAL",

right:
rupiah(transaction.total),

bold:true

});


content.push({

type:"divider"

});



/* =========================
   PEMBAYARAN
   ========================= */

content.push({

type:"text",

text:
"Pembayaran : "+
transaction.pembayaran

});


if(
transaction.pembayaran==="Cash"
){

content.push({

type:"text",

text:
"Diterima : "+
rupiah(
transaction.cashReceived
)

});


content.push({

type:"text",

text:
"Kembalian : "+
rupiah(
transaction.change
)

});

}



/* =========================
   FOOTER
   ========================= */

content.push({

type:"feed",

lines:1

});


content.push({

type:"text",

text:"Terima Kasih",

align:"center"

});


content.push({

type:"feed",

lines:3

});



/* =====================================================
   KIRIM KE CLEANTER
   ===================================================== */

try{

const response=
await fetch(

"http://localhost:9100/print",

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:
JSON.stringify({

cut:true,

content:
content

}),

signal:
AbortSignal.timeout(5000)

}

);



if(
!response.ok
){

throw new Error(
"Cleanter error "+
response.status
);

}



let result=
await response.json();



if(
result.status==="printed"
){

return true;

}else{

alert(

"Print gagal: "+
JSON.stringify(result)

)

)

)

.replace(
