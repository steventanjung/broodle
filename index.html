<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Kasir Sederhana</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f2f2f2;
padding:15px;
}

.page{
display:none;
}

.page.active{
display:block;
}

button{
padding:10px 15px;
border:none;
border-radius:6px;
cursor:pointer;
margin:3px;
}

input, select{
padding:10px;
width:100%;
margin:5px 0;
}

.card{
background:white;
padding:15px;
margin-top:10px;
border-radius:8px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.menuItem{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
border-bottom:1px solid #ddd;
}

.qtyBox{
display:flex;
align-items:center;
gap:8px;
}

.qtyBtn{
width:30px;
height:30px;
border-radius:50%;
}

.nav{
margin-bottom:15px;
}

#receipt{
width:58mm;
background:white;
padding:10px;
font-size:12px;
display:none;
}

.center{
text-align:center;
}

.right{
text-align:right;
}

.line{
border-top:1px dashed black;
margin:6px 0;
}

.paymentBox{
margin-top:15px;
padding-top:15px;
border-top:1px solid #ddd;
}

.change{
font-size:18px;
font-weight:bold;
margin-top:8px;
}

.success{
padding:10px;
background:#e8f5e9;
border-radius:6px;
margin-top:10px;
}

@media print{

body *{
visibility:hidden;
}

#receipt,
#receipt *{
visibility:visible;
}

#receipt{
position:absolute;
left:0;
top:0;
width:58mm;
}

}

</style>
</head>

<body>

<div class="nav">

<button
style="display:none;"
onclick="showPage('menuPage')">
Kelola Menu
</button>

<button onclick="showPage('cashierPage');renderCashier();">
Kasir
</button>


</div>


<!-- ================= MENU ================= -->

<div id="menuPage" class="page active">

<div class="card">

<h2>Tambah Menu</h2>

<input
id="nama"
placeholder="Nama Barang">

<input
id="harga"
type="number"
placeholder="Harga">

<button onclick="addMenu()">
Tambah
</button>

</div>

<div class="card">

<h3>Daftar Menu</h3>

<div id="menuList"></div>

</div>

</div>


<!-- ================= KASIR ================= -->

<div id="cashierPage" class="page">

<div class="card">

<h2>Kasir</h2>

<div id="cashierList"></div>

<h2 id="grandTotal">
Total : Rp0
</h2>

<div class="paymentBox">

<h3>Pembayaran</h3>

<select id="paymentMethod" onchange="paymentChanged()">

<option value="cash">
Cash
</option>

<option value="qris">
QRIS
</option>

</select>

<div id="cashPayment">

<label>
Uang diterima
</label>

<input
id="cashReceived"
type="number"
placeholder="Masukkan uang"
oninput="calculateChange()">

<div id="changeDisplay" class="change">
Kembalian : Rp0
</div>

</div>

<div id="qrisPayment" style="display:none;">

<p>
Pembayaran melalui QRIS
</p>

</div>

<button onclick="completeTransaction()">
Selesaikan & Simpan
</button>

</div>

</div>

</div>


<!-- ================= NOTA ================= -->

<div id="receipt">

<div class="center">

<b>TOKO SAYA</b><br>

Jl. Contoh

</div>

<div class="line"></div>

<div id="receiptInfo"></div>

<div class="line"></div>

<div id="receiptItems"></div>

<div class="line"></div>

<div class="right">

<b id="receiptTotal"></b>

</div>

<div class="line"></div>

<div id="receiptPayment"></div>

<div class="line"></div>

<div class="center">

Terima Kasih

</div>

<br>

<button onclick="printReceipt()">
Print
</button>

</div>


<script>

/* =====================================================
   GOOGLE SHEETS
   ===================================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwyKe1AdCJG-rRFJqQlM9u5odQKUSPUirskaqPriC63vVm7IEIgaEXkeKnm1nUdap47/exec";


/* =====================================================
   DATA
   ===================================================== */

let menus =
JSON.parse(localStorage.getItem("menus")) || [];

let cart = {};

let nota =
parseInt(localStorage.getItem("nota")) || 1;

let currentTransaction = null;


/* =====================================================
   SAVE MENU
   ===================================================== */

function save(){

localStorage.setItem(
"menus",
JSON.stringify(menus)
);

}


/* =====================================================
   PAGE
   ===================================================== */

function showPage(id){

document
.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");

}


/* =====================================================
   RUPIAH
   ===================================================== */

function rupiah(n){

return "Rp"+
Number(n).toLocaleString("id-ID");

}


/* =====================================================
   MENU
   ===================================================== */

function addMenu(){

let nama =
document.getElementById("nama").value.trim();

let harga =
parseInt(document.getElementById("harga").value);

if(nama=="" || isNaN(harga)){

alert("Lengkapi data");

return;

}

menus.push({
nama:nama,
harga:harga
});

save();

document.getElementById("nama").value="";
document.getElementById("harga").value="";

renderMenu();

}


function deleteMenu(index){

if(!confirm("Hapus menu?")) return;

menus.splice(index,1);

save();

renderMenu();

}


function editMenu(index){

let nama=prompt(
"Nama Barang",
menus[index].nama
);

if(nama===null) return;

let harga=prompt(
"Harga",
menus[index].harga
);

if(harga===null) return;

harga=parseInt(harga);

if(nama.trim()=="" || isNaN(harga)){

alert("Data tidak valid");

return;

}

menus[index].nama=nama.trim();

menus[index].harga=harga;

save();

renderMenu();

}


function renderMenu(){

let html="";

menus.forEach((m,i)=>{

html+=`

<div class="menuItem">

<div>

<b>${escapeHtml(m.nama)}</b><br>

${rupiah(m.harga)}

</div>

<div>

<button onclick="editMenu(${i})">
Edit
</button>

<button onclick="deleteMenu(${i})">
Hapus
</button>

</div>

</div>

`;

});

document.getElementById("menuList").innerHTML=html;

}


/* =====================================================
   KASIR
   ===================================================== */

function renderCashier(){

cart={};

let html="";

menus.forEach((m,i)=>{

cart[i]=0;

html+=`

<div class="menuItem">

<div>

<b>${escapeHtml(m.nama)}</b><br>

${rupiah(m.harga)}

</div>

<div class="qtyBox">

<button
class="qtyBtn"
onclick="minusQty(${i})">
-
</button>

<span id="qty${i}">
0
</span>

<button
class="qtyBtn"
onclick="plusQty(${i})">
+
</button>

</div>

</div>

`;

});

document.getElementById("cashierList").innerHTML=html;

document.getElementById("cashReceived").value="";

document.getElementById("changeDisplay").innerText=
"Kembalian : Rp0";

updateTotal();

}


function plusQty(index){

cart[index]++;

document.getElementById("qty"+index).innerText=
cart[index];

updateTotal();

}


function minusQty(index){

if(cart[index]>0){

cart[index]--;

document.getElementById("qty"+index).innerText=
cart[index];

updateTotal();

}

}


/* =====================================================
   TOTAL
   ===================================================== */

function getTotal(){

let total=0;

menus.forEach((m,i)=>{

total+=m.harga*(cart[i]||0);

});

return total;

}


function updateTotal(){

let total=getTotal();

document.getElementById("grandTotal").innerHTML=
"Total : <b>"+rupiah(total)+"</b>";

calculateChange();

}


/* =====================================================
   PEMBAYARAN
   ===================================================== */

function paymentChanged(){

let method =
document.getElementById("paymentMethod").value;

if(method==="cash"){

document.getElementById("cashPayment")
.style.display="block";

document.getElementById("qrisPayment")
.style.display="none";

}else{

document.getElementById("cashPayment")
.style.display="none";

document.getElementById("qrisPayment")
.style.display="block";

}

}


function calculateChange(){

let total=getTotal();

let received =
parseInt(
document.getElementById("cashReceived").value
) || 0;

let change=received-total;

if(change<0){
change=0;
}

document.getElementById("changeDisplay").innerText=
"Kembalian : "+rupiah(change);

}


/* =====================================================
   SELESAIKAN TRANSAKSI
   ===================================================== */

async function completeTransaction(){

let total=getTotal();

if(total<=0){

alert("Belum ada barang dipilih");

return;

}

let paymentMethod =
document.getElementById("paymentMethod").value;

let cashReceived=0;
let change=0;

if(paymentMethod==="cash"){

cashReceived =
parseInt(
document.getElementById("cashReceived").value
) || 0;

if(cashReceived<total){

alert(
"Uang diterima kurang.\n\n"+
"Total: "+rupiah(total)
);

return;

}

change=cashReceived-total;

}


/* =========================
   BUAT ITEM
   ========================= */

let items=[];

menus.forEach((m,i)=>{

if(cart[i]>0){

let subtotal =
m.harga*cart[i];

items.push({

nama:m.nama,

qty:cart[i],

harga:m.harga,

subtotal:subtotal

});

}

});


/* =========================
   WAKTU
   ========================= */

let now=new Date();

let tanggal =
now.toLocaleDateString("id-ID");

let jam =
now.toLocaleTimeString("id-ID");


/* =========================
   NOMOR NOTA
   ========================= */

let nomorNota =
String(nota).padStart(4,"0");


/* =========================
   DATA TRANSAKSI
   ========================= */

let transaction={

tanggal:tanggal,

jam:jam,

nota:nomorNota,

pembayaran:
paymentMethod==="cash"
?"Cash"
:"QRIS",

cashReceived:cashReceived,

change:change,

total:total,

items:items

};

currentTransaction=transaction;


/* =========================
   SIMPAN GOOGLE SHEETS
   ========================= */

try{

await saveToGoogleSheets(transaction);

}catch(error){

console.error(error);

let lanjut=confirm(
"Transaksi gagal dikirim ke Google Sheets.\n\n"+
"Apakah tetap ingin menyelesaikan transaksi?"
);

if(!lanjut){

return;

}

}


/* =========================
   GENERATE NOTA
   ========================= */

generateReceipt(transaction);


/* =========================
   NOMOR NOTA NAIK
   ========================= */

nota++;

localStorage.setItem(
"nota",
nota
);


/* =========================
   RESET KERANJANG
   ========================= */

cart={};

alert(
"Transaksi berhasil disimpan.\n"+
"No Nota: "+nomorNota
);

}


/* =====================================================
   GOOGLE SHEETS
   ===================================================== */

async function saveToGoogleSheets(data){

/*
   mode: no-cors dipakai agar browser Android/iOS
   tidak memblokir request ke Google Apps Script.
*/

await fetch(
GOOGLE_SCRIPT_URL,
{
method:"POST",

mode:"no-cors",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify(data)

}
);

}


/* =====================================================
   GENERATE RECEIPT
   ===================================================== */

function generateReceipt(transaction){

let itemHtml="";

transaction.items.forEach(item=>{

itemHtml+=`

<div style="margin-bottom:6px;">

<div>
<b>${escapeHtml(item.nama)}</b>
</div>

<div style="display:flex;justify-content:space-between;">

<span>
${item.qty} x ${rupiah(item.harga)}
</span>

<span>
${rupiah(item.subtotal)}
</span>

</div>

</div>

`;

});


document.getElementById("receiptInfo").innerHTML=
`
No Nota : ${transaction.nota}<br>
${transaction.tanggal}<br>
${transaction.jam}
`;


document.getElementById("receiptItems")
.innerHTML=itemHtml;


document.getElementById("receiptTotal")
.innerHTML=
"TOTAL : "+rupiah(transaction.total);


let paymentHtml="";

if(transaction.pembayaran==="Cash"){

paymentHtml=`

Pembayaran : Cash<br>
Diterima : ${rupiah(transaction.cashReceived)}<br>
Kembalian : ${rupiah(transaction.change)}

`;

}else{

paymentHtml=`

Pembayaran : QRIS

`;

}

document.getElementById("receiptPayment")
.innerHTML=paymentHtml;


document.getElementById("receipt")
.style.display="block";

}


/* =====================================================
   PRINT RPP02N VIA CLEANTER
   ===================================================== */

async function printReceipt(){

if(!currentTransaction){

alert("Belum ada transaksi");

return;

}

let transaction=currentTransaction;

let content=[];


/* =========================
   HEADER
   ========================= */

content.push({

type:"text",

text:"TOKO SAYA",

align:"center",

bold:true,

size:"large"

});


content.push({

type:"text",

text:"Jl. Contoh",

align:"center"

});


content.push({
type:"divider"
});


/* =========================
   INFO
   ========================= */

content.push({

type:"text",

text:"No Nota : "+transaction.nota

});


content.push({

type:"text",

text:
transaction.tanggal+
" "+
transaction.jam

});


content.push({
type:"divider"
});


/* =========================
   ITEM
   ========================= */

transaction.items.forEach(item=>{

content.push({

type:"text",

text:item.nama,

bold:true

});


content.push({

type:"row",

left:
item.qty+
" x "+
rupiah(item.harga),

right:
rupiah(item.subtotal)

});

});


content.push({
type:"divider"
});


/* =========================
   TOTAL
   ========================= */

content.push({

type:"row",

left:"TOTAL",

right:rupiah(transaction.total),

bold:true

});


content.push({
type:"divider"
});


/* =========================
   PEMBAYARAN
   ========================= */

content.push({

type:"text",

text:"Pembayaran : "+
transaction.pembayaran

});


if(transaction.pembayaran==="Cash"){

content.push({

type:"text",

text:"Diterima : "+
rupiah(transaction.cashReceived)

});

content.push({

type:"text",

text:"Kembalian : "+
rupiah(transaction.change)

});

}


content.push({

type:"feed",

lines:1

});


content.push({

type:"text",

text:"Terima Kasih",

align:"center"

});


content.push({

type:"feed",

lines:3

});


/* =========================
   SEND TO CLEANTER
   ========================= */

try{

const response=await fetch(

"http://localhost:9100/print",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

cut:true,

content:content

}),

signal:AbortSignal.timeout(5000)

}

);


if(!response.ok){

throw new Error(
"Cleanter error "+response.status
);

}


let result=await response.json();


if(result.status==="printed"){

alert("Nota berhasil dicetak");

}else{

alert(
"Print gagal: "+
JSON.stringify(result)
);

}


}catch(error){

console.error(error);

alert(

"Printer tidak terhubung.\n\n"+

"Pastikan:\n"+

"1. RPP02N sudah Bluetooth paired\n"+

"2. Cleanter sudah terpasang\n"+

"3. RPP02N dipilih sebagai printer di Cleanter"

);

}

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =====================================================
   INISIALISASI
   ===================================================== */

renderMenu();


/* =========================
   MENU CONTOH
   ========================= */

if(menus.length===0){

menus.push(

{
nama:"Menu A",
harga:15000
},

{
nama:"Menu B",
harga:18000
},

{
nama:"Es Teh",
harga:5000
}

);

save();

renderMenu();

}

</script>

</body>
</html>
